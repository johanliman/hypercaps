<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600">
  <!-- Canvas Background -->
  <rect width="860" height="600" fill="#f8fafc"/>
  <rect x="15" y="15" width="830" height="570" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(45, 48)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="0.5">SLOCS</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0284c7">Frontend</text>
  </g>

  <!-- Terminal Box -->
  <g transform="translate(45, 90)">
    <rect width="770" height="255" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- macOS style window dots -->
    <g transform="translate(14, 14)">
      <circle cx="0" cy="0" r="4.5" fill="#ff5f56"/>
      <circle cx="14" cy="0" r="4.5" fill="#ffbd2e"/>
      <circle cx="28" cy="0" r="4.5" fill="#27c93f"/>
    </g>

    <!-- Terminal Monospace Text -->
    <g transform="translate(24, 46)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="12" fill="#c9d1d9">
      <text x="0" y="0" fill="#8b949e">14 text files.</text>
      <text x="0" y="16" fill="#8b949e">14 unique files.</text>
      <text x="0" y="32" fill="#8b949e"> 0 files ignored.</text>

      <text x="0" y="60" fill="#58a6ff">github.com/AlDanial/cloc v 2.06  T=0.08 s (175.0 files/s, 50987.5 lines/s)</text>
      <line x1="0" y1="72" x2="722" y2="72" stroke="#30363d" stroke-dasharray="4,2"/>

      <!-- Header row -->
      <g transform="translate(0, 88)" font-weight="bold">
        <text x="0" y="0" fill="#f0f6fc">Language</text>
        <text x="220" y="0" text-anchor="end" fill="#8b949e">files</text>
        <text x="340" y="0" text-anchor="end" fill="#8b949e">blank</text>
        <text x="470" y="0" text-anchor="end" fill="#8b949e">comment</text>
        <text x="580" y="0" text-anchor="end" fill="#8b949e">code</text>
      </g>

      <line x1="0" y1="98" x2="722" y2="98" stroke="#30363d" stroke-dasharray="4,2"/>

      <!-- Row 1: CSS -->
      <g transform="translate(0, 114)">
        <text x="0" y="0" fill="#56b6c2" font-weight="bold">CSS</text>
        <text x="220" y="0" text-anchor="end" fill="#c9d1d9">1</text>
        <text x="340" y="0" text-anchor="end" fill="#c9d1d9">394</text>
        <text x="470" y="0" text-anchor="end" fill="#c9d1d9">37</text>
        <text x="580" y="0" text-anchor="end" fill="#56b6c2" font-weight="bold">2260</text>
      </g>

      <!-- Row 2: TypeScript -->
      <g transform="translate(0, 132)">
        <text x="0" y="0" fill="#61afef" font-weight="bold">TypeScript</text>
        <text x="220" y="0" text-anchor="end" fill="#c9d1d9">12</text>
        <text x="340" y="0" text-anchor="end" fill="#c9d1d9">173</text>
        <text x="470" y="0" text-anchor="end" fill="#c9d1d9">19</text>
        <text x="580" y="0" text-anchor="end" fill="#61afef" font-weight="bold">1806</text>
      </g>

      <!-- Row 3: HTML -->
      <g transform="translate(0, 150)">
        <text x="0" y="0" fill="#e5c07b" font-weight="bold">HTML</text>
        <text x="220" y="0" text-anchor="end" fill="#c9d1d9">1</text>
        <text x="340" y="0" text-anchor="end" fill="#c9d1d9">0</text>
        <text x="470" y="0" text-anchor="end" fill="#c9d1d9">0</text>
        <text x="580" y="0" text-anchor="end" fill="#e5c07b" font-weight="bold">13</text>
      </g>

      <line x1="0" y1="162" x2="722" y2="162" stroke="#30363d" stroke-dasharray="4,2"/>

      <!-- Row 4: SUM -->
      <g transform="translate(0, 178)" font-weight="bold">
        <text x="0" y="0" fill="#f0f6fc">SUM:</text>
        <text x="220" y="0" text-anchor="end" fill="#f0f6fc">14</text>
        <text x="340" y="0" text-anchor="end" fill="#f0f6fc">567</text>
        <text x="470" y="0" text-anchor="end" fill="#f0f6fc">56</text>
        <text x="580" y="0" text-anchor="end" fill="#f0f6fc">4079</text>
      </g>

      <line x1="0" y1="190" x2="722" y2="190" stroke="#30363d" stroke-dasharray="4,2"/>
    </g>
  </g>

  <!-- Formatted Summary Table Below (Matching user example) -->
  <g transform="translate(45, 365)">
    <!-- Table Header -->
    <rect width="770" height="38" fill="#f8fafc" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="220" y1="0" x2="220" y2="38" stroke="#1e293b" stroke-width="1.2"/>
    <line x1="480" y1="0" x2="480" y2="38" stroke="#1e293b" stroke-width="1.2"/>

    <text x="24" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Language</text>
    <text x="240" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Files</text>
    <text x="500" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Comments</text>
    <text x="680" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Code</text>

    <!-- Row 1: CSS -->
    <g transform="translate(0, 38)">
      <rect width="770" height="38" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="220" y1="0" x2="220" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="480" y1="0" x2="480" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <text x="24" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">CSS</text>
      <text x="240" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">1</text>
      <text x="500" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">37</text>
      <text x="680" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0891b2">2260</text>
    </g>

    <!-- Row 2: TypeScript -->
    <g transform="translate(0, 76)">
      <rect width="770" height="38" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="220" y1="0" x2="220" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="480" y1="0" x2="480" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <text x="24" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">TypeScript</text>
      <text x="240" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">12</text>
      <text x="500" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">19</text>
      <text x="680" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0284c7">1806</text>
    </g>

    <!-- Row 3: HTML -->
    <g transform="translate(0, 114)">
      <rect width="770" height="38" fill="#ffffff" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="220" y1="0" x2="220" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="480" y1="0" x2="480" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <text x="24" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">HTML</text>
      <text x="240" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">1</text>
      <text x="500" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">0</text>
      <text x="680" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#d97706">13</text>
    </g>

    <!-- Row 4: Total Sum -->
    <g transform="translate(0, 152)">
      <rect width="770" height="38" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="220" y1="0" x2="220" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <line x1="480" y1="0" x2="480" y2="38" stroke="#1e293b" stroke-width="1.2"/>
      <text x="24" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">SUM:</text>
      <text x="240" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">14</text>
      <text x="500" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">56</text>
      <text x="680" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">4079</text>
    </g>
  </g>
</svg>